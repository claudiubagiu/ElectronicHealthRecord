<div class="diagnostics-page">
  <div class="diagnostics-card">

    <!-- Header -->
    <div class="card-header">
      <button mat-icon-button class="back-btn" (click)="goBack()" matTooltip="Back to profile">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <div class="icon-wrapper">
        <mat-icon>folder_shared</mat-icon>
      </div>
      <h1>My Diagnostics</h1>
      <p class="subtitle">Your medical diagnoses stored on the blockchain</p>
    </div>

    <!-- Loading -->
    @if (isLoading) {
      <div class="state-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading your records...</p>
      </div>
    }

    <!-- Empty -->
    @if (!isLoading && diagnoses.length === 0) {
      <div class="state-container empty">
        <mat-icon class="empty-icon">inventory_2</mat-icon>
        <p>No diagnoses found.</p>
      </div>
    }

    <!-- List -->
    @if (!isLoading && diagnoses.length > 0) {
      <div class="diagnostics-list">
        @for (d of diagnoses; track d.id) {
          <app-shared-record-card
            type="diagnosis"
            [title]="d.title"
            [timestamp]="Number(d.timestamp)"
            [authorName]="d.doctorName"
            [walletAddress]="d.doctorAddr"
            [ipfsCid]="d.ipfsCid"
            [isDownloading]="downloadingId === d.id"
            (downloadClick)="openFile(d)">
          </app-shared-record-card>
        }
      </div>
    }

  </div>
</div>
