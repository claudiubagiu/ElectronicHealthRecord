<div class="patient-medical-data-page">
  <div class="patient-medical-data-card">
    <div class="card-header">
      <button
        mat-icon-button
        class="back-btn"
        (click)="goBack()"
        matTooltip="Back to patient profile"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="icon-wrapper">
        <mat-icon>health_and_safety</mat-icon>
      </div>
      <h1>{{ patientName }}</h1>
      <p class="subtitle">Medical data — allergies, conditions, immunizations and more</p>
    </div>

    @if (patientId) {
    <app-medical-records-panel [patientId]="patientId" [selectionMode]="false">
    </app-medical-records-panel>
    }
  </div>
</div>
