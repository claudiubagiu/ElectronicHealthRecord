<div class="lab-analyses-page">
  <div class="lab-analyses-card">

    <div class="card-header">
      <button mat-icon-button class="back-btn" (click)="goBack()" matTooltip="Back to profile">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <div class="icon-wrapper">
        <mat-icon>biotech</mat-icon>
      </div>
      <h1>My Lab Analyses</h1>
      <p class="subtitle">Your lab analyses stored on the blockchain</p>
    </div>

    @if (isLoading) {
      <div class="state-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading your records...</p>
      </div>
    }

    @if (!isLoading && analyses.length === 0) {
      <div class="state-container empty">
        <mat-icon class="empty-icon">inventory_2</mat-icon>
        <p>No lab analyses found yet.</p>
      </div>
    }

    @if (!isLoading && analyses.length > 0) {
      <div class="analyses-list">
        @for (a of analyses; track a.id) {
          <app-shared-record-card
            type="lab-analysis"
            [title]="a.title"
            [timestamp]="Number(a.timestamp)"
            [authorName]="a.labTechName"
            [walletAddress]="a.labTechAddr"
            [ipfsCid]="a.ipfsCid"
            [isDownloading]="downloadingId === a.id"
            (downloadClick)="openFile(a)">
          </app-shared-record-card>
        }
      </div>
    }

  </div>
</div>
