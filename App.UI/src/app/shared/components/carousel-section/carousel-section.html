<div class="carousel-section">
  <div class="section-header">
    <div class="section-title">
      <mat-icon class="section-icon">{{ icon }}</mat-icon>
      <h2>{{ title }}</h2>
    </div>
    <div class="carousel-arrows">
      <button mat-icon-button (click)="scroll('left')">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-icon-button (click)="scroll('right')">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

  @if (isLoading) {
    <div class="state-container small">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  }

  @if (!isLoading && isEmpty) {
    <div class="state-container empty small">
      <mat-icon>{{ emptyIcon }}</mat-icon>
      <p>{{ emptyMessage }}</p>
    </div>
  }

  @if (!isLoading && !isEmpty) {
    <div class="carousel-track" #track>
      <ng-content></ng-content>
    </div>
  }
</div>
