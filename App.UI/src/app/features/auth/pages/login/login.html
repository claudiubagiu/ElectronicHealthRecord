<div class="login-page">
  <div class="login-content">

    <!-- Icon -->
    <div class="icon-wrapper">
      <mat-icon>account_balance_wallet</mat-icon>
    </div>

    <!-- Title -->
    <h1>Welcome back!</h1>
    <p class="subtitle">Connect your MetaMask wallet to sign in</p>

    <!-- Button -->
    <button
      mat-flat-button
      class="login-button"
      (click)="onLogin()"
      [disabled]="isLoading"
    >
      <ng-container *ngIf="!isLoading; else loading">
        <mat-icon>account_balance_wallet</mat-icon>
        Connect with MetaMask
      </ng-container>
      <ng-template #loading>
        <mat-spinner diameter="22" class="button-spinner"></mat-spinner>
        Connecting...
      </ng-template>
    </button>

    <!-- Register link -->
    <p class="register-text">
      Don't have an account?
      <a routerLink="/register">Create one now</a>
    </p>

  </div>
</div>
