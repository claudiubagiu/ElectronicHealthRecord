<div class="assistant-patient-profile-page">
  <!-- ===== PROFILE CARD ===== -->
  <app-profile-card
    [name]="patientName"
    role="Patient"
    roleIcon="personal_injury"
    avatarColor="orange"
    [showBackButton]="true"
    backTooltip="Back to Patient Access"
    (backClick)="goBack()"
    [details]="profileDetails"
  >
  </app-profile-card>

  <!-- ===== DRAFT BANNER ===== -->
  @if (!isLoadingDraft && activeDraft) {
  <div class="draft-banner">
    <div class="draft-banner-icon">
      <mat-icon>edit_note</mat-icon>
    </div>
    <div class="draft-banner-info">
      <span class="draft-banner-title">An active draft exists for this patient</span>
      <span class="draft-banner-subtitle">
        Last updated {{ activeDraft.updatedAt | date : 'dd MMM yyyy, HH:mm' }}
      </span>
    </div>
    <button mat-flat-button class="draft-banner-btn" (click)="goToDraft()">
      <mat-icon>arrow_forward</mat-icon>
      Continue editing
    </button>
  </div>
  }

  <!-- ===== DIAGNOSTICS ===== -->
  <app-carousel-section
    title="Diagnostics"
    icon="folder_shared"
    [isLoading]="isLoadingDiagnoses"
    [isEmpty]="diagnoses.length === 0"
    emptyIcon="inventory_2"
    emptyMessage="No diagnoses found."
  >
    @for (d of diagnoses; track d.id) {
    <app-medical-card
      type="diagnosis"
      [title]="d.title"
      [meta]="[
        { icon: 'medical_services', text: d.doctorName },
        { icon: 'event', text: (formatTimestamp(d.timestamp) | date : 'dd MMM yyyy') }
      ]"
      [isLoading]="openingDiagnosisId === d.id"
      actionLabel="View report"
      (actionClick)="onOpenDiagnosis(d)"
    >
    </app-medical-card>
    }

    <app-view-all-card
      icon="folder_shared"
      label="View all diagnostics"
      (clicked)="goToDiagnostics()"
    >
    </app-view-all-card>
  </app-carousel-section>

  <!-- ===== PRESCRIPTIONS ===== -->
  <app-carousel-section
    title="Prescriptions"
    icon="receipt_long"
    [isLoading]="isLoadingPrescriptions"
    [isEmpty]="prescriptions.length === 0"
    emptyIcon="receipt_long"
    emptyMessage="No prescriptions found."
  >
    @for (p of prescriptions; track p.id) {
    <app-medical-card
      type="prescription"
      [meta]="[
        { icon: 'medical_services', text: 'Dr. ' + p.doctorName },
        { icon: 'event', text: (formatTimestamp(p.timestamp) | date : 'dd MMM yyyy') }
      ]"
      [isLoading]="openingPrescriptionId === p.id"
      actionLabel="View PDF"
      (actionClick)="onOpenPrescription(p)"
    >
    </app-medical-card>
    }

    <app-view-all-card
      icon="receipt_long"
      label="View all prescriptions"
      (clicked)="goToPrescriptions()"
    >
    </app-view-all-card>
  </app-carousel-section>

  <!-- ===== LAB ANALYSES ===== -->
  <app-carousel-section
    title="Lab Analyses"
    icon="biotech"
    [isLoading]="isLoadingLabAnalyses"
    [isEmpty]="labAnalyses.length === 0"
    emptyIcon="biotech"
    emptyMessage="No lab analyses found."
  >
    @for (a of labAnalyses; track a.id) {
    <app-medical-card
      type="lab-analysis"
      [title]="a.title"
      [meta]="[
        { icon: 'science', text: a.labTechName },
        { icon: 'event', text: (formatTimestamp(a.timestamp) | date : 'dd MMM yyyy') }
      ]"
      [isLoading]="openingLabAnalysisId === a.id"
      actionLabel="View report"
      (actionClick)="onOpenLabAnalysis(a)"
    >
    </app-medical-card>
    }

    <app-view-all-card icon="biotech" label="View all analyses" (clicked)="goToLabAnalyses()">
    </app-view-all-card>
  </app-carousel-section>

  <!-- ===== QUICK ACTIONS ===== -->
  <div class="quick-actions-section">
    <app-quick-action-card
      [label]="activeDraft ? 'Continue Draft' : 'Create Draft Diagnosis'"
      icon="edit_note"
      color="blue"
      (clicked)="goToDraft()"
    />
    <app-quick-action-card
      label="All Diagnostics"
      icon="folder_shared"
      color="purple"
      (clicked)="goToDiagnostics()"
    />
    <app-quick-action-card
      label="Lab Analyses"
      icon="biotech"
      color="cyan"
      (clicked)="goToLabAnalyses()"
    />
    <app-quick-action-card
      label="Prescriptions"
      icon="receipt_long"
      color="orange"
      (clicked)="goToPrescriptions()"
    />
    <app-quick-action-card
      label="Medical Data"
      icon="health_and_safety"
      color="orange"
      (clicked)="goToMedicalData()"
    />
  </div>
</div>
